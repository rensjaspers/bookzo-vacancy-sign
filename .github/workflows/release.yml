name: Release Pi Bundle

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install SDL2 for native arm64 CGO build
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev pkg-config

      - uses: docker/setup-qemu-action@v3

      - run: make package-pi-universal PI_CONFIG=config.pi.example.json

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/bookzo-vacancy-sign-pi-universal.zip
